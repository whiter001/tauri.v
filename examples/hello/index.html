<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>vtauri hello</title>
  <style>
    body { font-family: system-ui, 'Segoe UI', sans-serif; margin: 0;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; background: #f5f5f7; color: #1a1a1a; }
    .card { background: #fff; border-radius: 12px; padding: 32px 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08); text-align: center; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p  { color: #555; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px;
             background: #24c8db; color: #fff; font-size: 15px; cursor: pointer; }
    button:hover { opacity: .9; }
    output { display: block; margin-top: 16px; font-family: monospace; color: #24c8db; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>vtauri hello</h1>
    <p>由 V 语言实现的 Tauri 风格桌面框架示例</p>
    <button id="greetBtn">调用后端 greet</button>
    <button id="dialogMsgBtn">弹出消息框</button>
    <button id="dialogOpenBtn">打开文件</button>
    <button id="dialogSaveBtn">保存文件</button>
    <output id="out">--</output>
  </div>

  <!-- vtauri 前端 API -->
  <script src="vtauri.js"></script>
  <script>
    document.getElementById('greetBtn').addEventListener('click', async function () {
      var out = document.getElementById('out');
      out.textContent = '调用中...';
      try {
        // 调用 V 后端注册的 greet 命令
        var result = await window.__VTauri.invoke('greet', 'whiter');
        out.textContent = result;
      } catch (e) {
        out.textContent = '错误: ' + e.message;
      }
    });
    document.getElementById('dialogMsgBtn').addEventListener('click', async function () {
      var out = document.getElementById('out');
      out.textContent = '调用中...';
      try {
        var result = await window.__VTauri.invoke('dialog_msg', '');
        out.textContent = result;
      } catch (e) {
        out.textContent = '错误: ' + e.message;
      }
    });
    document.getElementById('dialogOpenBtn').addEventListener('click', async function () {
      var out = document.getElementById('out');
      out.textContent = '调用中...';
      try {
        var result = await window.__VTauri.invoke('dialog_open', '');
        out.textContent = result;
      } catch (e) {
        out.textContent = '错误: ' + e.message;
      }
    });
    document.getElementById('dialogSaveBtn').addEventListener('click', async function () {
      var out = document.getElementById('out');
      out.textContent = '调用中...';
      try {
        var result = await window.__VTauri.invoke('dialog_save', '');
        out.textContent = result;
      } catch (e) {
        out.textContent = '错误: ' + e.message;
      }
    });
  </script>
</body>
</html>
