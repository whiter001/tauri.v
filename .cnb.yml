main:
  pull_request:
    - name: verify
      docker:
        image: vlang/v:latest
      stages:
        - name: test
          script: |
            v version
            v test vtauri
        - name: build
          script: |
            # 验证示例在 Linux 上可编译运行（窗口为桩，不依赖 mingw 交叉编译链）
            cd examples/hello
            v -o hello main.v
            ./hello
        - name: cross-build
          allowFailure: true
          script: |
            # Windows 交叉编译（需要 mingw 工具链，镜像未预装时跳过）
            command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 || { echo 'mingw not available, skip cross-build'; exit 0; }
            cd examples/hello
            v -os windows -o hello.exe main.v
            file hello.exe
  push:
    - name: verify
      docker:
        image: vlang/v:latest
      stages:
        - name: test
          script: |
            v version
            v test vtauri
